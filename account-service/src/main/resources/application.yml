spring:
  application:
    name: account-service
  datasource:
    hikari:
      # mais de uma thread de consumer por listener + requisições HTTP disputam conexões
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/account
  kafka:
    listener:
      # threads por @KafkaListener; só ajuda se o tópico tiver partições suficientes (ver KafkaTopicsConfig)
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      properties:
        # tópicos são criados pelo KafkaTopicsConfig (com várias partições), nunca sob demanda pelo consumer
        allow.auto.create.topics: false
        # descobre partições novas em 30s (padrão: 5 min) caso o tópico seja ampliado com o serviço no ar
        metadata.max.age.ms: 30000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:banco-digital-saga-jwt-secret-desenvolvimento-nao-usar-em-producao}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
