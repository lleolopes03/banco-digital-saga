spring:
  application:
    name: notification-service
  data:
    mongodb:
      # Desde o Spring Data MongoDB 3.0 a criacao automatica de indices vem DESLIGADA: sem isto o
      # @CompoundIndex de Notification (accountId + createdAt, usado pelo GET /api/notifications)
      # e o indice TTL de ProcessedEvent nunca eram criados — so existia o _id. O volume deste
      # servico e pequeno e o schema e controlado por nos, entao criar na subida e adequado.
      auto-index-creation: true
  mongodb:
    representation:
      # Sem isso, o driver do MongoDB recusa a codificação de qualquer campo UUID (accountId,
      # transferId em Notification/ProcessedEvent) com CodecConfigurationException — o driver 5.x
      # não assume mais um formato padrão de UUID (existem 4 representações binárias distintas e
      # incompatíveis entre si: JAVA_LEGACY, C_SHARP_LEGACY, PYTHON_LEGACY, STANDARD). STANDARD é
      # o formato recomendado para bancos novos, sem dados legados de outro driver. Propriedade
      # fica em spring.mongodb (MongoProperties), não spring.data.mongodb (DataMongoProperties,
      # que só cobre autoIndexCreation/fieldNamingStrategy/gridfs/bigDecimal) — são classes de
      # configuração distintas nesta versão do Spring Boot.
      uuid: standard
  kafka:
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:banco-digital-saga-jwt-secret-desenvolvimento-nao-usar-em-producao}
