receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Primeiro da cadeia: se o Jaeger/exportador ficar lento, o coletor recusa spans novos em vez de
  # acumular na memória até cair. Os serviços seguem funcionando (a exportação é assíncrona).
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:

exporters:
  # Jaeger (all-in-one) já fala OTLP nativamente desde que o coletor embutido esteja habilitado
  # (COLLECTOR_OTLP_ENABLED=true no docker-compose.yml) — o collector aqui não faz nenhuma
  # tradução de protocolo, só recebe de todos os 3 serviços e repassa em lote.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, debug]
