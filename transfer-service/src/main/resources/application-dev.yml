server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${TRANSFER_DB_HOST:localhost}:${TRANSFER_DB_PORT:5443}/${TRANSFER_DB_NAME:transfer_db}
    username: ${TRANSFER_DB_USER:transfer}
    password: ${TRANSFER_DB_PASSWORD:transfer}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

account-service:
  base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8081}

management:
  # Nome da propriedade mudou no Spring Boot 4.1 (management.otlp.tracing.endpoint da linha 3.x
  # não existe mais) — sem isso o exportador de traces fica sem endpoint configurado e nenhum
  # span sai para o otel-collector/Jaeger, silenciosamente.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        otlp:
          enabled: false # métricas são expostas via /actuator/prometheus (scrape), não push OTLP
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
